# unit-test: 팀원이 만든 테스트(tests/, worker/tests/)를 실행한다.
name: unit-test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 파이썬 패키지 설치
        run: pip install -r requirements.txt pytest

      # worker/Dockerfile과 같은 버전의 Gitleaks를 공식 이미지에서 꺼내 온다
      - name: Gitleaks 설치
        run: |
          docker create --name gitleaks ghcr.io/gitleaks/gitleaks:v8.30.1
          sudo docker cp gitleaks:/usr/bin/gitleaks /usr/local/bin/gitleaks
          docker rm gitleaks
          gitleaks version

      # 테스트가 임시 Git 저장소를 만들 때 필요한 이름·메일 (가짜 값)
      - name: Git 사용자 설정
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"

      # REQUIRE_GITLEAKS=1: Gitleaks가 없으면 건너뛰지 않고 실패시킨다
      # Trivy 실제 검사 테스트 1개는 Trivy가 없어 건너뛴다 (image-scan 워크플로에서 다룸)
      - name: 테스트 실행
        env:
          REQUIRE_GITLEAKS: "1"
        run: python -m pytest tests worker/tests -v
