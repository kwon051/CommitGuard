# lint: 파이썬 코드에 문법 오류·없는 이름·안 쓰는 import가 있는지 검사한다.
name: lint

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: flake8 설치
        run: pip install flake8

      # 여기서 걸리면 빨간 X: 문법 오류(E9), 없는 이름·안 쓰는 import 등(F)
      - name: 꼭 고쳐야 하는 오류 검사
        run: flake8 . --select=E9,F --show-source --statistics

      # 줄 길이·빈 줄 같은 스타일은 목록만 보여 주고 실패시키지 않는다
      - name: 스타일 참고 목록 (실패하지 않음)
        run: flake8 . --exit-zero --statistics
