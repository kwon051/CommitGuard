# deploy: web·worker 이미지를 만들어 Kubernetes에 배포하고, 검증이 끝난 이미지만 GHCR에 올린다.
#
# 1) k8s-deploy  : Actions 러너 안에 임시 Kubernetes(kind)를 띄우고 k8s/ 매니페스트를 그대로 적용한다.
#                  pod 6개(web 2·worker 2·queue 1·db 1)가 모두 Ready인지,
#                  검사 1건이 web → queue → worker → db 까지 도는지 확인한다. (scripts/k8s_test.sh)
# 2) publish     : develop·main에 push됐을 때만. 1)을 통과한 이미지를
#                  GitHub 컨테이너 저장소(ghcr.io)에 올린다. PR에서는 올리지 않는다.
name: deploy

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:          # Actions 탭에서 손으로 다시 돌릴 수 있게

permissions:
  contents: read

# 같은 브랜치에서 새로 push하면 이전 배포 실행은 취소한다
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k8s-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # k8s/web.yaml·worker.yaml이 쓰는 이름(commitguard-*:dev) 그대로 만든다
      - name: web·worker 이미지 만들기
        run: |
          docker build -t commitguard-web:dev .
          docker build -t commitguard-worker:dev ./worker

      - name: 임시 Kubernetes(kind) 띄우기
        uses: helm/kind-action@v1
        with:
          cluster_name: commitguard

      # 러너의 Docker에 있는 이미지를 kind 안으로 넣는다 (minikube image build와 같은 역할)
      - name: 이미지를 클러스터에 넣기
        run: |
          kind load docker-image commitguard-web:dev --name commitguard
          kind load docker-image commitguard-worker:dev --name commitguard

      # docs/k8s.md의 실행 순서와 같다. 러너에는 .env가 없으므로 가짜 값이 든 .env.example을 쓴다.
      # web pod 2개가 같은 세션 키를 쓰도록 FLASK_SECRET_KEY는 실행마다 무작위로 만든다.
      - name: Secret·ConfigMap 만들고 배포
        run: |
          cp .env.example .env
          if ! grep -q '^FLASK_SECRET_KEY=' .env; then
            printf '\nFLASK_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          fi
          kubectl create namespace commitguard
          kubectl -n commitguard create secret generic commitguard-secret --from-env-file=.env
          kubectl -n commitguard create configmap db-init --from-file=db/init.sql
          kubectl -n commitguard apply -f k8s/

      # db가 준비되기 전에는 web·worker가 몇 번 재시작될 수 있다 (docs/k8s.md "자주 나는 오류")
      - name: pod 6개 Ready 기다리기
        run: |
          for d in db queue web worker; do
            kubectl -n commitguard rollout status deployment/$d --timeout=300s
          done
          kubectl -n commitguard wait --for=condition=Ready pod --all --timeout=120s
          kubectl -n commitguard get pods -o wide
          ready=$(kubectl -n commitguard get pods --no-headers | awk '$2=="1/1" && $3=="Running"' | wc -l)
          echo "Ready pod: ${ready}개"
          if [ "$ready" -ne 6 ]; then
            echo "❌ Ready pod가 6개가 아닙니다"
            exit 1
          fi

      - name: 검사 1건 끝까지 돌려 보기
        run: bash scripts/k8s_test.sh

      # Actions 실행 화면 맨 앞(Summary)에 pod 목록을 남긴다 → 시연·발표 캡처용
      - name: 배포 결과 요약 (Summary 화면)
        if: always()
        run: |
          {
            echo "### Kubernetes 배포 결과 (namespace: commitguard)"
            echo ""
            echo "| Pod | Ready | 상태 | 재시작 |"
            echo "|---|---|---|---|"
            kubectl -n commitguard get pods --no-headers 2>/dev/null \
              | awk '{print "| " $1 " | " $2 " | " $3 " | " $4 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 실패 시 로그
        if: failure()
        run: |
          kubectl -n commitguard get pods,svc,pvc || true
          kubectl -n commitguard get events --sort-by=.lastTimestamp | tail -30 || true
          for app in web worker db queue; do
            echo "===== $app"
            kubectl -n commitguard logs -l app=$app --tail=50 --prefix || true
          done

  publish:
    needs: k8s-deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # ghcr.io에 이미지를 올릴 권한
    strategy:
      matrix:
        include:
          - name: web
            context: .
          - name: worker
            context: ./worker
    steps:
      - uses: actions/checkout@v4

      # 태그: 커밋 번호(sha) + 브랜치 이름. main이면 latest도 붙인다.
      # ghcr.io 주소는 소문자만 쓸 수 있어서 저장소 주인 이름을 소문자로 바꾼다.
      - name: 이미지 이름 정하기
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/commitguard-${{ matrix.name }}"
          tags="${image}:${GITHUB_SHA::7} ${image}:${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            tags="$tags ${image}:latest"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      # 별도 비밀번호 없이 Actions가 주는 GITHUB_TOKEN으로 로그인한다
      - name: ghcr.io 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: ${{ matrix.name }} 이미지 만들고 올리기
        run: |
          docker build -t "${{ steps.meta.outputs.image }}:build" ${{ matrix.context }}
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker tag "${{ steps.meta.outputs.image }}:build" "$tag"
            docker push "$tag"
            echo "- \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
