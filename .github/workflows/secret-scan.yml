# secret-scan: 우리 저장소의 Git 이력 전체에 Gitleaks를 돌려 비밀키·개인정보가 커밋됐는지 검사한다.
# 규칙은 worker와 같은 것(기본 + 국내 4종)을 쓰고, 테스트용 가짜 키가 있는 폴더만 뺀다(.gitleaks.toml).
name: secret-scan

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 → 마지막 커밋만이 아니라 Git 이력 전체를 받는다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # worker/Dockerfile과 같은 버전의 Gitleaks를 공식 이미지에서 꺼내 온다
      - name: Gitleaks 설치
        run: |
          docker create --name gitleaks ghcr.io/gitleaks/gitleaks:v8.30.1
          sudo docker cp gitleaks:/usr/bin/gitleaks /usr/local/bin/gitleaks
          docker rm gitleaks
          gitleaks version

      # 찾으면 빨간 X. --redact: 로그에 비밀값을 그대로 찍지 않는다
      - name: Git 이력 전체 검사
        run: gitleaks git . --config .gitleaks.toml --redact --verbose
