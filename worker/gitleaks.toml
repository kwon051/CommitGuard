# CommitGuard Gitleaks 설정: 기본 규칙 + 국내 규칙 4종 (기능 1)
#
# 사용:
#   gitleaks git <저장소> --config worker/gitleaks.toml
#   worker는 항상 --config로 이 파일을 지정한다. 검사 대상 저장소 안의
#   .gitleaks.toml이 대신 쓰이면 그 저장소가 규칙을 끌 수 있기 때문이다.
#
# 규칙 id는 모두 kr- 로 시작한다. 공통 형식(finding)의 rule_id에 그대로 들어간다.

title = "CommitGuard rules"

[extend]
useDefault = true   # Gitleaks 기본 규칙(AWS, GitHub 토큰 등)은 그대로 쓴다

# ---------------------------------------------------------------------------
# 1. 주민등록번호
#   - 월별 일수·윤년을 검사한다(1·2: 1900년대, 3·4: 2000년대), 뒤 첫 자리는 성별 1~4
#   - 하이픈(-) 형식만 잡는다. 13자리 숫자만 붙여 쓴 경우는 타임스탬프·주문번호와
#     구분이 안 돼 오탐이 많아서 제외한다.
#   - 검증번호(마지막 자리)로 거르지 않는다. 2020년 10월 이후 발급 번호는
#     뒷자리가 임의 숫자라 검증 공식이 맞지 않는다.
# ---------------------------------------------------------------------------
[[rules]]
id = "kr-rrn"
description = "Korean resident registration number (주민등록번호)"
regex = '''\b((?:\d{2}(?:(?:0[13578]|1[02])(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)(?:0[1-9]|[12]\d|30)|02(?:0[1-9]|1\d|2[0-8]))-[1-4]\d{6}|(?:0[48]|[2468][048]|[13579][26])0229-[1-4]\d{6}|000229-[34]\d{6}))\b'''
secretGroup = 1
tags = ["kr", "pii"]

  [[rules.allowlists]]
  description = "특정 교재용 예시 한 건만 제외(뒷자리 패턴만으로 제외하지 않음)"
  regexTarget = "secret"
  regexes = ['''^800101-1234567$''']

# ---------------------------------------------------------------------------
# 2. 010 휴대폰 번호
#   - 010 / +82 10 으로 시작, 가운데 4자리는 2~9로 시작(실제 배정 범위)
#   - 구분자는 - . 공백 또는 없음
#   - 앞뒤에 숫자가 더 붙은 긴 숫자열은 제외(\b)
# ---------------------------------------------------------------------------
[[rules]]
id = "kr-mobile"
description = "Korean mobile phone number (010 휴대폰 번호)"
regex = '''(?:\b010|\+82[- ]?10)[-. ]?[2-9]\d{3}[-. ]?\d{4}\b'''
keywords = ["010", "+82"]
tags = ["kr", "pii"]

  [[rules.allowlists]]
  description = "명시적인 예시 번호만 제외(끝자리 0000 전체를 제외하지 않음)"
  regexTarget = "secret"
  regexes = ['''^010[-. ]?5555[-. ]?5555$''']

# ---------------------------------------------------------------------------
# 3. 학번
#   - 숫자만으로는 다른 번호와 구분할 수 없으므로, '학번'이나 student_id 같은
#     이름 바로 뒤에 값이 오는 경우만 잡는다.
#   - 값 형식: 입학년도(2000~2039)로 시작하는 8~10자리.
#     학교마다 형식이 다르면 아래 (20[0-3]\d{5,7}) 부분만 바꾼다.
# ---------------------------------------------------------------------------
[[rules]]
id = "kr-student-id"
description = "Student ID number (학번)"
regex = '''(?i)(?:학번|hakbun|student[_-]?(?:id|no|num(?:ber)?)|stu[_-]?(?:id|no))["']?\s*[:=]\s*["']?(20[0-3]\d{5,7})\b'''
secretGroup = 1
keywords = ["학번", "hakbun", "student", "stu_", "stu-", "stuid", "stuno"]
tags = ["kr", "pii"]

# ---------------------------------------------------------------------------
# 4. 국내 서비스 API 키 (카카오, 네이버, 네이버 클라우드, 공공데이터포털)
#   - 서비스 이름이 들어간 변수·설정 이름 뒤에 값이 직접 적힌 경우
#   - 공공데이터포털 주소의 serviceKey= 값 (URL 인코딩 포함)
#   - os.environ, process.env, ${VAR} 처럼 환경 변수에서 읽는 코드는 값 자리에
#     괄호·점·달러 문자 때문에 이 규칙의 값 형식과 맞지 않는다.
# ---------------------------------------------------------------------------
[[rules]]
id = "kr-service-api-key"
description = "Korean service API key (Kakao, Naver, NCP, data.go.kr)"
regex = '''(?i)(?:kakao|naver|ncloud|ncp|data[._-]?go[._-]?kr|public[_-]?data|odcloud|service[_-]?key)[\w.-]{0,40}?["']?\s*[:=]\s*["']?([A-Za-z0-9%+/=_-]{10,150})(?:["'&\s;,]|$)'''
secretGroup = 1
entropy = 3.0
keywords = ["kakao", "naver", "ncloud", "ncp", "data.go.kr", "datagokr", "data_go_kr", "publicdata", "public_data", "odcloud", "servicekey", "service_key", "service-key"]
tags = ["kr", "api-key"]

  [[rules.allowlists]]
  description = "자리표시자 값"
  stopwords = ["your", "example", "sample", "dummy", "changeme", "placeholder", "xxxx", "insert"]
