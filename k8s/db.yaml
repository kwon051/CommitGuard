# MySQL (compose의 db). 저장 공간 신청서(PVC) + pod 1개 + 이름표(Service) "db".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data      # compose의 db-data 볼륨
spec:
  accessModes: ["ReadWriteOnce"]   # pod 하나만 붙여 쓴다
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  # 새 pod를 띄우기 전에 옛 pod를 먼저 끈다. 같은 PVC를 두 MySQL이 동시에 쓰지 않게.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: commitguard-secret, key: MYSQL_ROOT_PASSWORD }
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef: { name: commitguard-secret, key: MYSQL_DATABASE }
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: commitguard-secret, key: MYSQL_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: commitguard-secret, key: MYSQL_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # 3306 포트가 열렸는지로 준비 여부를 본다. MySQL은 첫 초기화 중에는 3306을 열지 않는다.
          # (mysqladmin ping은 소켓 경로에 의존해서, GitHub Actions의 kind에서는
          #  서버와 소켓 경로가 어긋나 계속 실패했다 → deploy 워크플로)
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
        # db/init.sql을 담은 ConfigMap (만드는 명령은 docs/k8s.md)
        - name: init
          configMap:
            name: db-init
---
apiVersion: v1
kind: Service
metadata:
  name: db           # web·worker가 db:3306으로 접속한다
spec:
  type: ClusterIP    # 클러스터 안에서만 열림 (밖으로 3306 공개 안 함)
  selector:
    app: db
  ports:
    - port: 3306
      targetPort: 3306
