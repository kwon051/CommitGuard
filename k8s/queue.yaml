# 작업 큐 (compose의 queue). pod 1개 + 이름표(Service) "queue".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue
  template:
    metadata:
      labels:
        app: queue
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8
          ports:
            - containerPort: 6379
          # compose의 healthcheck와 같은 역할: 준비되기 전에는 Service가 연결을 보내지 않는다.
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: queue        # web·worker가 queue:6379로 접속한다
spec:
  selector:
    app: queue
  ports:
    - port: 6379
      targetPort: 6379
