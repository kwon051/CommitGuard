# 웹 화면 (compose의 web). pod 2개 + 밖에서 접속하는 Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: commitguard-web:dev       # 로컬에서 빌드한 이미지 (docs/k8s.md)
          imagePullPolicy: IfNotPresent    # 있으면 Docker Hub에서 받지 않는다
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: { name: commitguard-config }   # VALKEY_HOST 등
            - secretRef: { name: commitguard-secret }      # MYSQL_* 비밀번호 등
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: commitguard-secret
                  key: FLASK_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort     # 클러스터 밖(내 컴퓨터)에서 접속할 수 있게 연다
  selector:
    app: web         # app: web 이름표가 붙은 pod 2개에 나눠 보낸다
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
